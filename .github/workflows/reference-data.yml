name: Refresh reference data

# Fetches Octopus tariff rates, 12 months of Agile prices and PVGIS sample
# yields into data/ (scripts/reference-data/fetch.mjs). Runs on GitHub's
# servers, so the browser never calls these APIs.
#
# - Monthly and on manual dispatch: opens a PR into main with the new data.
#   Needs Settings -> Actions -> General -> "Allow GitHub Actions to create
#   and approve pull requests".
# - On a push to a non-main branch that changes the fetcher: commits the data
#   straight to that branch, so a feature PR can carry its own data.
on:
  schedule:
    - cron: '17 5 2 * *'
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/reference-data/**
      - .github/workflows/reference-data.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reference-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Fetch
        run: node scripts/reference-data/fetch.mjs
      - name: Summary
        run: |
          node -e "const m=require('./data/manifest.json');console.log(JSON.stringify({tariffs:m.tariffs,pvgis:m.pvgis,errors:m.errors},null,2))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit to this branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh reference data ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Open a pull request
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/reference-data-$(date -u +%Y-%m-%d)"
          git checkout -B "$branch"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh reference data ($(date -u +%Y-%m-%d))"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: refresh reference data ($(date -u +%Y-%m-%d))" \
            --body "Monthly refresh of Octopus tariff presets, 12-month Agile history and PVGIS sample yields by the reference-data workflow. Check the run summary for any fetch problems before merging." \
            || echo "PR already exists or PR creation is not allowed for Actions."
