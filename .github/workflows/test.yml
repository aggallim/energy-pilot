name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Reference data files are valid JSON
        run: |
          for f in $(find data -name '*.json' 2>/dev/null); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
